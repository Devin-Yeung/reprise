[package]
name = "reprise-daemon"
description = "Daemon configuration and hosting interface for Reprise."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "reprised"
path = "src/main.rs"

[dependencies]
typed-builder.workspace = true
clap.workspace = true
reprise-api.workspace = true

[dev-dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
