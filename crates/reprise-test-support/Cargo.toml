[package]
name = "reprise-test-support"
description = "Real Docker fixtures and digest-pinned images for opt-in integration tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Docker is external infrastructure; ordinary workspace tests never select it.
integration-tests = []

[[test]]
name = "registry"
required-features = ["integration-tests"]

[[test]]
name = "fixture"
required-features = ["integration-tests"]

[dependencies]
anyhow = "1"
bollard.workspace = true
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }

# Bollard's SSH connector uses OpenSSH and is Unix-only.
[target.'cfg(unix)'.dependencies]
bollard = { workspace = true, features = ["ssh"] }

[lints]
workspace = true
