name: Publish test image

on:
  pull_request:
    paths:
      - '.github/workflows/publish-test-image.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'test-tools/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-test-image.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'test-tools/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            system: x86_64-linux
            runner: ubuntu-24.04
          - arch: arm64
            system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: docker/setup-buildx-action@v3

      - name: Build with Nix
        id: image
        env:
          SYSTEM: ${{ matrix.system }}
          ARCH: ${{ matrix.arch }}
        run: |
          attr="path:.#packages.${SYSTEM}.reprise-test-image"
          nix build --no-update-lock-file "$attr" --out-link result-test-image
          tag=$(nix eval --no-update-lock-file --raw "${attr}.imageTag")
          image="ghcr.io/${GITHUB_REPOSITORY,,}-test-image"
          {
            echo "local=reprise-test-image:$tag"
            echo "image=$image"
            echo "ref=$image:$tag-$ARCH"
          } >> "$GITHUB_OUTPUT"
          # Loading is a publisher verification step, never a business-test fallback.
          gzip --decompress --stdout result-test-image | docker image load

      - name: Verify platform
        env:
          IMAGE: ${{ steps.image.outputs.local }}
          ARCH: ${{ matrix.arch }}
        run: |
          # Confirm the image matches this runner. Do not execute memory-state:
          # its contract is expected to change independently of publication.
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = "linux/$ARCH"

      - uses: docker/login-action@v3
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push platform image
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          LOCAL_IMAGE: ${{ steps.image.outputs.local }}
          IMAGE: ${{ steps.image.outputs.image }}
          REF: ${{ steps.image.outputs.ref }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker image tag "$LOCAL_IMAGE" "$REF"
          docker image push "$REF"
          digest=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' | jq -er '.digest')
          jq -n --arg image "$IMAGE" --arg arch "$ARCH" --arg digest "$digest" \
            '{image: $image, arch: $arch, digest: $digest}' > "$ARCH.json"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        with:
          name: image-metadata-${{ matrix.arch }}
          path: ${{ matrix.arch }}.json
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish multi-architecture index
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-metadata-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and verify index
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-test-image"
          sources=()
          for arch in amd64 arm64; do
            jq -e --arg image "$image" --arg arch "$arch" \
              '.image == $image and .arch == $arch and (.digest | test("^sha256:[0-9a-f]{64}$"))' "$arch.json"
            sources+=("$image@$(jq -r '.digest' "$arch.json")")
          done
          # Assemble from digests, not mutable platform tags.
          ref="$image:fixture-$GITHUB_SHA"
          docker buildx imagetools create --tag "$ref" "${sources[@]}"
          docker buildx imagetools inspect "$ref" --raw | jq -e \
            '([.manifests[].platform | .os + "/" + .architecture] | sort) == ["linux/amd64", "linux/arm64"]'
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -er '.digest')
          printf '%s@%s\n' "$image" "$digest" > test-image.ref
          {
            echo '## Published test fixture'
            echo 'Pin this reference in the consuming tests; do not use the publishing tag as a test default.'
            echo '```text'
            tr -d '\r' < test-image.ref
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: test-image-reference
          path: test-image.ref
          retention-days: 30
          if-no-files-found: error
